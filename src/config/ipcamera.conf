# IPCamera Configuration File
# Hi3516CV300 Platform

[video]
main_width = 1920
main_height = 1080
main_bitrate = 4096
sub_width = 1280
sub_height = 720
sub_bitrate = 1024
frame_rate = 25
gop = 50
sensor_fps = 30
codec = h264
rc_mode = cbr

[network]
ip = 192.168.1.100
netmask = 255.255.255.0
gateway = 192.168.1.1
rtsp_port = 554
rtsp_auth = 0
# rtsp_user = admin
# rtsp_pass = admin123

[motion]
enable = 1
region_count = 1
region_0_x = 0
region_0_y = 0
region_0_w = 1920
region_0_h = 1080
region_0_sens = 5
region_0_thresh = 40

[record]
enable = 1
# mode: 0=manual 1=motion 2=schedule 3=continuous
mode = 3
slice_time = 10
max_days = 7
pre_record = 5
post_record = 30
min_free_mb = 256
mount_point = /mnt/sdcard/record
